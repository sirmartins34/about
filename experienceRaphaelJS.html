<body style="background-color:background-color: rgba(255, 255, 255, 0);margin:0;padding:0;" height="100%" onresize="onResize();">

<table width="100%" border="0" cellspacing="0" cellpadding="0">

			<table width="100%" border="0" cellspacing="0" cellpadding="0">

<script type="text/javascript">
function WrapText(text, maxWidth)
{
	var words = text.split(" ");
	var t = paper.text(100, 100).attr('text-anchor', 'start');

	var tempText = "";
	for (var i=0; i<words.length; i++) {
	  t.attr("text", tempText + " " + words[i]);
	  if (t.getBBox().width > maxWidth) {
		tempText += "\n" + words[i];
	  } else {
		tempText += " " + words[i];
	  }
	}
	t.remove();
	return tempText;
}
function FormatProject(project) {
	var ret = project.description;
	if (project.tools)
		ret += "\nTools: " + project.tools;
	if (project.contextEngineering)
		ret += "\nContext Engineering: " + project.contextEngineering;
	if (project.languages)
		ret += "\nLanguages: " + project.languages;

	return ret;
}
function AssemblyTextForExperienceProjects(list) {
	return list.map((project, index) => FormatProject(project))
				.join('\n\t\n');
};


function MonthDiff(d1, d2) {
    var months;
    months = (d2.getFullYear() - d1.getFullYear()) * 12;
    months -= d1.getMonth() + 1;
    months += d2.getMonth();
    return months <= 0 ? 0 : months;
}

	var buttonSize = 25;
	var mainWindowMargin = 30;
	var mainWindowRound = 30;

	var experienceYearStart = 2002;
	var experienceYearEnd = new Date().getFullYear();
	var experienceMonthEnd = new Date().getMonth() + 1;


	var graphPaddingLeft = 20;
	var graphPaddingBottom = 50;
	var numberGraphMarkersize = 9;
	var numberGraphMarkers = 5;
	var graphSeparator = 5;
	var selectedOptionColor = '#ED3100';

	var btnsFont = {font: "14px Fontin-Sans, Arial", fill: "#fff", "text-anchor": "start", opacity:0.3};
	var btnRefreshAttr = {fill: "rgba(125, 243, 16, 0)", stroke: "#777", "stroke-width": "0"};
	var btnIconAttr = {fill: "#7DF310", stroke: "#777", "stroke-width": "0.3"};
	var btnIconAttrHighlight = {fill: "#DAF310", stroke: "#777", "stroke-width": "0.3"};
	var defaultFontTitle = {font: "12px Arial", fill: "#fff", "text-anchor": "start"};
	var defaultFont = {font: "12px Arial", fill: "#ccc", "text-anchor": "start"};
	var experienceGraphFont = { font: "10px Arial", fill: "#ccc", "text-anchor": "middle" };
	var skillGraphFont = { font: "10px Arial", fill: "#ccc", "text-anchor": "end" };
	var graphFontYY = {font: "12px Arial", fill: "#ccc", "text-anchor": "start"};
	var graphFontXX = {font: "10px Arial", fill: "#ccc", "text-anchor": "end"};

	var windowRect = {
						x: mainWindowMargin + (mainWindowRound/2),
						y: mainWindowMargin + (mainWindowRound/2),
						w: $('#cvCanvas').width() - mainWindowMargin*2,
						h: document.documentElement.clientHeight - mainWindowMargin*2 - 5
					};
	var selectedOptionBtn = undefined;
	var selectedOptionTxt = undefined;
	var selectedOptionIcon = undefined;
	
	var workExperienceItem = new Array();
	var workExperienceLabel = null;
	var workExperienceLabelPosX = null;
	var workExperienceLabelPosY = null;
	var workExperienceDescription = null;
	var visibleMainControls = null;

	
	
	

	//verify if browser supports SVG
	if (!Raphael.svg && !Raphael.vml)
	{
		alert("Sorry. You browser does not support SVG or VML.");
	}
	else
	{
		// Creates canvas
		var canvasWidth = windowRect.w + mainWindowMargin*2;
		var canvasHeigth = windowRect.h + mainWindowMargin*2;
		if (canvasWidth < 0)
			canvasWidth = window.outerWidth + mainWindowMargin*2;
		if (canvasHeigth < 0)
			canvasHeigth = window.outerHeight + mainWindowMargin*2;
		var paper = Raphael("cvCanvas", canvasWidth, canvasHeigth); // id, w, h


		function showWorkExperienceDescription(pos) {
			var maxTextWidth = window.outerWidth - (mainWindowRound * 3) - (mainWindowMargin * 3);
			if (window.outerWidth > 765) maxTextWidth = maxTextWidth * 0.9;
			var loc = WrapText(experience[pos].local, windowRect.w - (mainWindowMargin*5));
			var projectsText = AssemblyTextForExperienceProjects(experience[pos].projects);
			var desc = WrapText(projectsText, maxTextWidth);
			
			var posLoc = workExperienceLabelPosY - 40 - ((loc.split("\n").length/2) * (12)) + (loc.split("\n").length * (16));
			// var posDesc = workExperienceLabelPosY -
			// 	((desc.split("\n").length/2) * (12)) + (desc.split("\n").length * (12 + 1));
			var posDesc = posLoc + 70;
			if (loc.split("\n").length > 1)
				posDesc += (loc.split("\n").length * 12);

			var animWE1 = Raphael.animation({x: workExperienceLabelPosX+30, opacity:0}, 200, 'linear',
				function() { this.attr({ x:workExperienceLabelPosX, y: posLoc, text: loc })});
			var animWE2 = Raphael.animation({opacity:1}, 0, 'linear',
				function() { workExperienceDescription.attr({ opacity:1, text: desc, y: posDesc })});
			var animated1 = workExperienceLabel.animate(animWE1); // run the given animation immediately
			var animated2 = workExperienceLabel.animate(animWE2.delay(300)); // r
			
			workExperienceDescription.animateWith(animated1, animWE1, {opacity:0}); // run the given animation immediately
		}
		function SetWorkExperience() {
			var newVisibleMainControls = paper.set();

			var numberGraphExpYearSpace = ((windowRect.x + windowRect.w - (mainWindowRound * 2)) - (mainWindowRound)) / ((experienceYearEnd+1) - experienceYearStart);

			var maxRows = 0;
			for (var i = 0; i < experience.length; i++) {
				if (maxRows < parseInt(experience[i].row))
					maxRows = parseInt(experience[i].row);
			}
			maxRows++;
			var graphSetYPos = maxRows * 22;


			workExperienceLabel = paper.text(windowRect.x-5, windowRect.y+20+graphSetYPos+50,"(select graph for detail)").attr(graphFontYY).attr({'text-anchor': 'start'});
			workExperienceLabelPosX = workExperienceLabel.getBBox().x;
			workExperienceDescription = paper.text(windowRect.x-5, windowRect.y+20+graphSetYPos+85,"\u00a0").attr(graphFontYY).attr({'text-anchor': 'start'});
			workExperienceLabelPosY = workExperienceDescription.getBBox().y;
			newVisibleMainControls.push(
				workExperienceLabel.attr({ font: "16px Fontin-Sans, Arial", fill: "#fff", "text-anchor": 'start', opacity:1 }),
				workExperienceDescription.attr({ font: "12px Fontin-Sans, Arial", fill: "#ccc", "text-anchor": 'start', opacity:1 })
			);

			
			for (var i = 0; i < experience.length; i++) {
			    var yearInit = Math.floor(experience[i].init);
			    var monthInit = experience[i].init.toString().replace(/^[^\.]+/, '0')*100;

				var yearEnd = experienceYearEnd;
				var monthEnd = experienceMonthEnd;
				if (experience[i].end !== undefined) {
					yearEnd = Math.floor(experience[i].end);
					monthEnd = experience[i].end.toString().replace(/^[^\.]+/, '0')*100;
				}

				var dateInit = new Date(yearInit, monthInit-1, 1);
				var dateEnd = new Date(yearEnd, monthEnd-1, 1);
				var difMonths = MonthDiff(dateInit, dateEnd);

				var animWidth = ((yearEnd - experienceYearStart + ((monthEnd - 1) / 11)) * numberGraphExpYearSpace) - ((yearInit - experienceYearStart + ((monthInit - 1) / 11)) * numberGraphExpYearSpace);
				if (animWidth < 0) animWidth = 0;
				var animGraph = Raphael.animation({ width: animWidth },
					300 + difMonths * 10);
				var animText = Raphael.animation({ opacity: 1 },
					300 + difMonths * 10);

				var color = Raphael.getRGB(experience[i].color);
				var hslColor = Raphael.rgb2hsb(color.r, color.g, color.b);
				var hightlightColor = Raphael.hsb2rgb(hslColor.h, hslColor.s, parseFloat(hslColor.b)+experience[i].hightlightBrightness).hex;
				workExperienceItem[i] = paper.rect(windowRect.x + 1 + ((yearInit - experienceYearStart + ((monthInit - 1) / 11)) * numberGraphExpYearSpace),
                        windowRect.y + (experience[i].row*27),
                        0,
                        20,
                        0)
                        .attr({ "stroke-width": "0.3", fill: experience[i].color, title: experience[i].local })
						.data({"pos": i, "defColor": experience[i].color, "hightlightColor": hightlightColor})
						.animate(animGraph.delay(((yearInit - experienceYearStart + ((monthInit - 1) / 11)) * numberGraphExpYearSpace*2)))
						.mouseover(function() { this.animate( {fill: this.data("hightlightColor")} , 200)} )
						.mouseout(function() { this.animate( {fill: this.data("defColor")}, 200 )} )
						.click(function() { showWorkExperienceDescription(this.data("pos")) });

			    newVisibleMainControls.push(
					workExperienceItem[i],
					paper.text(
						windowRect.x + 1 + ((yearInit - experienceYearStart + ((monthInit - 1) / 11)) * numberGraphExpYearSpace)
							+ ((experience[i].textalign == "start") ? 0 :
								((experience[i].textalign == "end") ? 
									((((yearEnd - experienceYearStart + ((monthEnd - 1) / 11)) * numberGraphExpYearSpace) - ((yearInit - experienceYearStart + ((monthInit - 1) / 11)) * numberGraphExpYearSpace)))
									:
								((((yearEnd - experienceYearStart + ((monthEnd - 1) / 11)) * numberGraphExpYearSpace) - ((yearInit - experienceYearStart + ((monthInit - 1) / 11)) * numberGraphExpYearSpace)) / 2))),
						windowRect.y + (experience[i].row*27) + 10,
						experience[i].abrev)
						.attr({ font: "12px Fontin-Sans, Arial", fill: "#fff", "text-anchor": experience[i].textalign, opacity:0, title: experience[i].local })
						.data({"pos": i, "defColor": experience[i].color, "hightlightColor": hightlightColor})
						.animate(animText.delay(((yearInit - experienceYearStart + ((monthInit - 1) / 11)) * numberGraphExpYearSpace*2)))
						.mouseover(function() { workExperienceItem[this.data("pos")].animate( {fill: this.data("hightlightColor")} , 200)} )
						.mouseout(function() { workExperienceItem[this.data("pos")].animate( {fill: this.data("defColor") }, 200 )} )
						.click(function() { showWorkExperienceDescription(this.data("pos")) })
				);
			}

 			// graph xx,yy
			newVisibleMainControls.push(
				paper.path("M" + (windowRect.x) + "," + (windowRect.y+20)
					+ "," + (windowRect.x) + "," + (windowRect.y+20+graphSetYPos)
					+ " " + (windowRect.x+windowRect.w-(mainWindowRound*2)) + "," +(windowRect.y+20+graphSetYPos))
			);

			for (var i = experienceYearStart; i <= (experienceYearEnd+1); i++) {
			    newVisibleMainControls.push(
			        paper.path("M" + (windowRect.x + ((i - experienceYearStart) * numberGraphExpYearSpace)) + "," + (windowRect.y + 20 + graphSetYPos) + ","
                        + (windowRect.x + ((i - experienceYearStart) * numberGraphExpYearSpace)) + "," + (windowRect.y + 20 + graphSetYPos + 5))
                );
			    if (i < (experienceYearEnd+1)) {
			        newVisibleMainControls.push(
			            paper.text(windowRect.x + ((i - experienceYearStart) * numberGraphExpYearSpace) + (numberGraphExpYearSpace / 4), windowRect.y + 25 + graphSetYPos + 10, i).attr(experienceGraphFont).attr({transform:"r315"}) // add nº year
                    );
			    }
			}
			
			newVisibleMainControls.changeWindow();
		}
		function ShowRefreshButton() {
			var btnWorkExperience = paper.rect($('#cvCanvas').width() - (buttonSize * 3),25,buttonSize,buttonSize,0).attr(btnRefreshAttr);
			var iconWorkExperience = paper.path("M16.19 2H7.81C4.17 2 2 4.17 2 7.81V16.18C2 19.83 4.17 22 7.81 22H16.18C19.82 22 21.99 19.83 21.99 16.19V7.81C22 4.17 19.83 2 16.19 2ZM12 18.01C8.83 18.01 6.25 15.43 6.25 12.26C6.25 9.09 8.83 6.51 12 6.51C12.14 6.51 12.29 6.53 12.43 6.54L12.15 6.22C11.88 5.91 11.91 5.43 12.22 5.16C12.53 4.89 13.01 4.92 13.28 5.23L14.95 7.14C14.96 7.15 14.96 7.16 14.97 7.17C14.98 7.18 14.99 7.18 14.99 7.19C15.01 7.22 15.02 7.26 15.04 7.3C15.06 7.35 15.09 7.39 15.1 7.44C15.11 7.49 15.11 7.53 15.12 7.58C15.12 7.63 15.13 7.67 15.13 7.72C15.13 7.77 15.11 7.81 15.09 7.86C15.07 7.91 15.06 7.96 15.04 8C15.02 8.04 14.98 8.08 14.95 8.12C14.92 8.15 14.91 8.19 14.88 8.21C14.87 8.22 14.86 8.22 14.85 8.23C14.84 8.24 14.84 8.25 14.83 8.25L12.89 9.67C12.76 9.77 12.6 9.81 12.45 9.81C12.22 9.81 11.99 9.7 11.84 9.5C11.6 9.17 11.67 8.7 12 8.45L12.56 8.04C12.37 8.03 12.19 8.01 12 8.01C9.66 8.01 7.75 9.92 7.75 12.26C7.75 14.6 9.66 16.51 12 16.51C14.34 16.51 16.25 14.6 16.25 12.26C16.25 11.41 16 10.6 15.54 9.9C15.31 9.56 15.4 9.09 15.75 8.86C16.09 8.63 16.56 8.72 16.79 9.07C17.42 10.02 17.76 11.12 17.76 12.26C17.75 15.44 15.17 18.01 12 18.01Z")
			 	.attr(btnIconAttr)
			 	.translate($('#cvCanvas').width() - (buttonSize * 3), 25);
			var setWorkExperience = paper.set();
			setWorkExperience.push(btnWorkExperience,
			 	iconWorkExperience
			 );

			setWorkExperience.btnSet(SetWorkExperience, btnWorkExperience, iconWorkExperience);//, txtWorkExperience);

			setWorkExperience.toFront();

			var evObj = document.createEvent('MouseEvents'); 
			evObj.initEvent('click', true, false); 
			btnWorkExperience?.node?.dispatchEvent(evObj);
		}


		///////////////////////////
		/// END OF MAIN BUTTONS ///
		///////////////////////////





		Raphael.st.btnSet = function(fnBtn, btn, icon) {
			this.attr({ cursor: "hand" })
				.click(function () {
						fnBtn();
					})
				 .mouseover(function () { icon.animate(btnIconAttrHighlight, 300); })
				 .mouseout(function () { icon.animate(btnIconAttr, 300); });
		};



		Raphael.st.changeWindow = function() {
			if (visibleMainControls != null) {
				visibleMainControls.forEach(function (el){el.animate({"fill-opacity": 0.0, opacity: 0.0},500,"backOut");});
			}
			this.animate({"fill-opacity":1.0},500,"backIn");

			visibleMainControls = this;
		};



		function Start()
		{
			// main window
			var mainWindowWidth = $('#cvCanvas').width() - (mainWindowRound);
			var mainWindowHeigth = $('#cvCanvas').height() - (mainWindowRound * 2);
			if (mainWindowWidth <= 0)
				mainWindowWidth = window.outerWidth - (mainWindowRound);
			if (mainWindowHeigth <= 0)
				mainWindowHeigth = window.outerHeight - (mainWindowRound * 2);
			var mainWindow = paper.rect((mainWindowRound/2), (mainWindowRound/2), mainWindowWidth, mainWindowHeigth, mainWindowRound)
					.attr({ fill: [90, '#595B63', '#424449'].join("-"), stroke: "#fff", "fill-opacity": 1, "stroke-width": 2 });

			SetWorkExperience();
			ShowRefreshButton();
		}

		
		Start();
	}
	
	
	function onResize()
	{
		if (!Raphael.svg && !Raphael.vml)
		{
			alert("Sorry. You browser does not support SVG or VML.");
		}
		else
		{
			windowRect = {
				x: mainWindowMargin,
				y: mainWindowMargin,
				w: $('#cvCanvas').width(),
				h: document.documentElement.clientHeight - 5
			};
		
			paper.remove();


			selectedOptionBtn = undefined;
			selectedOptionTxt = undefined;

			workExperienceItem = new Array();
			workExperienceLabel = null;
			workExperienceLabelPosX = null;
			workExperienceLabelPosY = null;
			workExperienceDescription = null;
			visibleMainControls = null;


			// Creates canvas
			paper = Raphael("cvCanvas", windowRect.w, windowRect.h); // id, w, h
		}

		Start();
	}
</script>
